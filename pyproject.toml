[project]
name = "outlook-graph-mcp-plus"
version = "0.1.1"
description = "Outlook (Microsoft 365) as a local MCP server via Microsoft Graph: mail, folders, attachments, calendar and To Do, with each organisation's own Entra app registration."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Alexander Rolli" }]
keywords = ["mcp", "outlook", "microsoft-graph", "microsoft-365", "email", "calendar", "claude", "entra"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "mcp[cli]>=1.26.0,<2",
    "msal>=1.31,<2",
    "msal-extensions>=1.2,<2",
    "httpx>=0.27,<1",
    "tzlocal>=5.2",
]

[project.urls]
Homepage = "https://github.com/lord-helicon/outlook-graph-mcp-plus"
Repository = "https://github.com/lord-helicon/outlook-graph-mcp-plus"
Issues = "https://github.com/lord-helicon/outlook-graph-mcp-plus/issues"

[project.scripts]
outlook-graph-mcp-plus = "outlook_graph_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "black>=24"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/outlook_graph_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
